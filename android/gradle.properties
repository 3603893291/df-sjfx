org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true
# ★ 必须留着：AGP 8.13 在配置阶段就拒绝任何含非 ASCII 的工程路径，而本仓库在
#   D:\zm\数据分析\ 下。关掉这道检查后实测 assembleDebug 全程可跑（aapt2 / D8 / 签名都正常）。
android.overridePathCheck=true
# 另：报「文件名、目录名或卷标语法不正确」不是路径的锅，是 local.properties 里
#   sdk.dir 的反斜杠转义写坏了 —— 那条路径一律用正斜杠。
